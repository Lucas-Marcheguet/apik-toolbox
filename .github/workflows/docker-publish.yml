name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify annotated tag
        id: tag_check
        run: |
          TAG_TYPE=$(git cat-file -t "${{ github.ref_name }}")
          echo "type=$TAG_TYPE" >> "$GITHUB_OUTPUT"
          if [ "$TAG_TYPE" != "tag" ]; then
            echo "::notice::Skipping — '${{ github.ref_name }}' is a lightweight tag, not an annotated tag."
          fi

      - name: Set up Docker Buildx
        if: steps.tag_check.outputs.type == 'tag'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.tag_check.outputs.type == 'tag'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        if: steps.tag_check.outputs.type == 'tag'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        if: steps.tag_check.outputs.type == 'tag'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
