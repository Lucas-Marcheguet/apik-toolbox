{% extends "base.html" %}

{% block title %}GAP to Odoo{% endblock %}

{% block content %}
<div class="min-w-[1/2] flex items-center justify-center px-6 py-8">
    <div class="w-full max-w-md">
        <div class="card bg-base-100 shadow-lg">
            <div class="card-body">
                <!-- Page header -->
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-bold text-base-content">GAP to Odoo</h1>
                    <p class="text-sm text-base-content/60 mt-2">
                        Upload a GAP Excel file and transform its content to be compatible with Odoo imports.
                    </p>
                </div>

                <div x-data="fileUpload()">
                    <div class="form-control w-full">
                        <label class="label">
                            <span class="label-text font-medium">Select Excel File</span>
                        </label>
                        <input type="file"
                            x-on:change="file = $event.target.files[0]"
                            class="file-input file-input-bordered w-full" />
                    </div>

                    <button
                        x-on:click="submitFile()"
                        x-bind:disabled="!file || loading"
                        class="btn btn-primary w-full mt-6">
                        <span x-show="loading" class="loading loading-spinner"></span>
                        <span x-show="loading">Chargement...</span>
                        <span x-show="!loading">Télécharger</span>
                    </button>

                    <div x-show="message" x-text="message" class="alert mt-4" :class="message.includes('✅') ? 'alert-success' : 'alert-error'"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function fileUpload() {
            return {
                file: null,
                loading: false,
                message: '',
                submitFile() {
                    this.loading = true;
                    const formData = new FormData();
                    formData.append('file', this.file);

                    fetch('/tools/gap_to_odoo/upload', {
                        method: 'POST',
                        body: formData
                    })
                    .then(response => {
                        if (!response.ok) {
                            this.message = '❌ Échec du téléchargement';
                            return;
                        }
                        const disposition = response.headers.get('Content-Disposition') || '';
                        const match = disposition.match(/filename\*?=(?:UTF-8'')?["']?([^"';\n]+)/i);
                        const filename = match ? decodeURIComponent(match[1]) : 'export.xlsx';
                        return response.blob().then(blob => {
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = filename;
                            a.click();
                            URL.revokeObjectURL(url);
                            this.message = '✅ Fichier prêt';
                        });
                    })
                    .finally(() => {
                        this.loading = false;
                    });
                }
            }
        }
    </script>

</div>
{% endblock %}
