<!DOCTYPE html>
<html lang="en" data-theme="apik">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6B6FBF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Toolbox">
    <title>{% block title %}Apik Toolbox{% endblock %}</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/static/img/LOGO_APIK_MIN.ico" type="image/x-icon">
    <link rel="stylesheet" href="/static/css/tailwind.css">
    <script src="/static/js/htmx.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () =>
                navigator.serviceWorker.register('/sw.js').catch(console.error)
            );
        }
    </script>
</head>
<body class="bg-base-200 min-h-screen flex flex-col">

    <!-- Top navigation bar -->
    <header class="bg-base-100 border-b border-base-300 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 h-14 flex items-center gap-3">
            <a href="/" class="flex items-center gap-3 shrink-0">
                <img src="/static/img/LOGO_APIK_MIN.png" alt="Apik" class="h-10">
                <span class="text-[11px] font-bold tracking-widest uppercase text-base-content/30
                             border-l border-base-300 pl-3">
                    Apik Toolbox
                </span>
            </a>
            {% block navbar_extra %}{% endblock %}
        </div>
    </header>

    <!-- Main content -->
    <main class="flex-1">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
